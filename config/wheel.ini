; EuroSpeed wheel / pedals, read directly by the bridge (works with ETS2 focused).
; Axis names: x y z rx ry rz s0 s1, or - for none. Defaults fit a Logitech G29.
; Run build\wheeltest.exe to see which axis moves.
[wheel]
enabled=1
device=
steering=x
throttle=y
brake=rz
clutch=s0
steering_invert=0
throttle_invert=1
brake_invert=1
clutch_invert=1
steering_deadzone=0
; Force feedback: BeamNG's steering force, applied by the bridge (works with ETS2 focused).
; Turn force feedback OFF in ETS2's and BeamNG's own controls, or they keep the wheel to themselves.
ffb=1
ffb_gain=1.0
; 1 if the wheel pulls the wrong way
ffb_invert=0

; H shifter (Logitech Driving Force Shifter on a G29), sets BeamNG's gear. Buttons counted from 0:
; 1-6 = 12-17, reverse = 18 (push down + 6th position). Run build\wheeltest.exe to see button numbers.
; Takes over after the first gear is engaged; set BeamNG's gearbox to manual. 0 = off.
shifter=1
gear1=12
gear2=13
gear3=14
gear4=15
gear5=16
gear6=17
reverse=18

[keys]
; With ETS2 focused, the keyboard drives BeamNG (Esc = BeamNG menu, R = reset, your BeamNG key
; bindings). The toggle key switches the keyboard to ETS2 (e.g. M for its map) and back.
route=1
toggle=f12
; where the keyboard goes when the bridge starts: beamng or ets2
start=beamng
; keys that always stay with ETS2 (they drive the car through ETS2 already)
ets2_keys=w,a,s,d,up,down,left,right

[view]
; the car is drawn this many cm lower in the ETS2 world: 0 = off, negative = higher.
; (20 suited the old road meshes, which lay a bit above ETS2's road; the ground block matches it)
car_lower_cm=-10

[ground]
; 1 = the ground around the car is one invisible BeamNG terrain block made from ETS2's road and
; terrain heights (no stutter when new ground loads); only bridges and walls stay meshes.
; Needs a BeamNG level without its own terrain (Grid Map / smallgrid); elsewhere: meshes as before.
terrain=1

[time]
; When the sun rises and sets in ETS2 (hh:mm on ETS2's clock): BeamNG's sun is moved to match, so
; the car's cabin is lit like ETS2's world. If BeamNG gets dark before ETS2 does, make
; ets2_sunset later (and the other way round).
ets2_sunrise=5:30
ets2_sunset=20:30
; How brightly the magenta key box glows by day and at night (nits). Less at night lets BeamNG's
; exposure open up for the cabin; more makes the cabin darker.
key_nits_day=600
key_nits_night=40
