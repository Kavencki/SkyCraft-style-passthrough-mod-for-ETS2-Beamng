; EuroSpeed overlay settings.
[gps]
; ETS2's navigation (GPS / route advisor) drawn on top of the car. Ctrl+Shift+G shows / hides it.
enabled=1
; Where ETS2 draws its GPS: left top width height, as fractions of ETS2's picture (0..1).
source=0.814 0.680 0.180 0.308
; Where to show it on top of the car (same numbers = in its usual place). E.g. on the car's
; centre screen, or smaller: 0.80 0.70 0.18 0.27
target=0.814 0.680 0.180 0.308
; 0..255
opacity=255
