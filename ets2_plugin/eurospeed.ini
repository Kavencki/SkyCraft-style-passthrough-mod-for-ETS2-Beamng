; EuroSpeed ETS2 plugin settings (put next to eurospeed.dll in bin\win_x64\plugins)
[camera]
; FOV for the ETS2 camera while driving the physics car:
;   vertical   = BeamNG's camera FOV as is (default)
;   horizontal = BeamNG's FOV converted to horizontal (try this if the overlaid cabin
;                looks too big or too small compared with the ETS2 world)
;   off        = keep ETS2's own FOV
fov=vertical

[truck]
; While the physics car drives, the ETS2 truck's physics body follows it, so ETS2 loads the map
; around the car (without this, ETS2 can crash a few km away from the truck).
;   puppet = 1 on, 0 off
;   height = metres above the road the truck rides at (negative = under it, out of sight)
;   back   = metres behind the car, along the road it drove
puppet=1
height=1
back=0
; the (invisible) truck's low beams on while the bridge drives, so they light the road: 1 on, 0 off
lights=1


[fuel]
; the ETS2 truck's fuel follows the BeamNG car's, and refuelling at an ETS2 station fills the car: 1 on, 0 off
link=1
; litres: the truck misses as many litres as the car (you pay for the car's litres)
; percent: same percentage (ETS2's gauge shows the car's level, but you pay for a truck tank)
mode=litres
